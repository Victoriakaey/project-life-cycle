name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests + skill references
        run: python3 scripts/validate.py

      # These previously existed but ran nowhere: validate.py has no pytest reference and
      # there is no Makefile, so the gate + hook test suites protected nothing unless a
      # human remembered to run them. A test that never runs is the same shape as a guard
      # that never checks.
      - name: Gate + hook unit tests
        run: |
          python -m pip install --quiet pytest pyyaml
          python -m pytest scripts/ -q

      # pyyaml is needed by the frontmatter assertion inside test-hooks.sh, not by the
      # gate tests — it is installed in the step above because both run on this job.
      - name: Hook behaviour suite
        run: |
          # `|| rc=$?` is load-bearing: GitHub runs `run:` blocks under `bash -e`, and
          # `cmd; rc=$?` is a two-command LIST — -e fires on the first one, killing the step
          # before `cat` ever runs, so a red suite printed nothing. Putting the suite on the
          # left of `||` puts it in a condition context, where -e does not fire.
          rc=0
          bash skills/project-lifecycle/hooks/test-hooks.sh >suite.log 2>&1 || rc=$?
          cat suite.log
          printf 'suite exit code: %s\n' "$rc"
          # The exit code is the whole judgement now: the suite keeps its results in a
          # file rather than a shell variable, so assertions inside its ( ) subshells reach
          # the tally, and it self-verifies that a failed assertion actually makes it exit
          # non-zero. A later fix shipped a second grep-the-output check here because the code could
          # not be trusted; that check is gone with the reason for it.
          if [ "$rc" -ne 0 ]; then
            echo "::error::hook behaviour suite exited $rc (assertion failed, or it died part-way)"
            exit 1
          fi

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !skills/**/SKILL.md
        continue-on-error: true

      - name: Check internal markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --offline --include-fragments **/*.md
          fail: true
