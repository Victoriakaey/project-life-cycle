name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests + skill references
        run: python3 scripts/validate.py

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !skills/**/SKILL.md
        continue-on-error: true

      - name: Check internal markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --offline --include-fragments **/*.md
          fail: true
